services:
  - type: worker
    name: telegram-ai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: bot-data
      mountPath: /opt/render/project/src
      sizeGB: 1
